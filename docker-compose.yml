services:
  python:
    build:
      context: ./Python
      dockerfile: Dockerfile
    container_name: rebulid01-python
    networks:
      - rebulid01-network
    ports:
      - "8000:8000"
    environment:
      SQLITE_DB_PATH: /data/strava.sqlite
      DATABASE_URL: postgresql://bcprace:bcprace_local@db:5432/bcprace
    depends_on:
      - db

    volumes:
      - ./data:/data
      - ./Python:/app/Python

  web:
    build:
      context: ./web/muj-next-app
      dockerfile: Dockerfile
    container_name: rebulid01-web
    networks:
      - rebulid01-network
    depends_on:
      - python
      - db
    env_file:
      - ./web/muj-next-app/.env.local
    environment:
      PYTHON_API_URL: http://python:8000
      DATABASE_URL: postgresql://bcprace:bcprace_local@db:5432/bcprace
      SQLITE_DB_PATH: /data/strava.sqlite
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./web/muj-next-app:/app
      - /app/node_modules
      - /app/.next

  mobile:
    build:
      context: ./mobile/my-app
      dockerfile: Dockerfile
    container_name: rebulid01-mobile
    networks:
      - rebulid01-network
    depends_on:
      - web
    env_file:
      - ./mobile/my-app/.env.local
    environment:
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-172.20.10.5}
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    stdin_open: true
    tty: true
    volumes:
      - ./mobile/my-app:/app
      - /app/node_modules
      - /app/.expo

  db:
    image: postgres:18
    container_name: rebulid01-db
    networks:
      - rebulid01-network 
    environment:
      POSTGRES_USER: bcprace
      POSTGRES_PASSWORD: bcprace_local
      POSTGRES_DB: bcprace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

networks:
  rebulid01-network:
    driver: bridge

volumes:
    pgdata:
