# Konfigurace Azure Container App "bcprace" (varianta A: web + python v jedne aplikaci).
# Obdoba docker-compose.prod.yml, jen pro Azure.
# Pouziti:
#   az containerapp create --name bcprace --resource-group rg-bcprace --yaml infra/containerapp.yaml
# Zadna hesla ani klice v tomto souboru nejsou (ty se pridaji pozdeji jako "secrets").

location: swedencentral

# "sluzebni prukaz" aplikace z kroku 4.3 (ma roli AcrPull na registry)
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/647d2913-b039-457f-9155-51291e506d79/resourceGroups/rg-bcprace/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-bcprace: {}

properties:
  # prostredi z kroku 4.2 (obdoba site v docker-compose)
  managedEnvironmentId: /subscriptions/647d2913-b039-457f-9155-51291e506d79/resourceGroups/rg-bcprace/providers/Microsoft.App/managedEnvironments/cae-bcprace

  configuration:
    # obdoba "ports" - verejny HTTPS pristup z internetu, posila se na port 3000 (web)
    ingress:
      external: true
      targetPort: 3000
    # odkud stahovat image a cim se prokazat
    registries:
      - server: bcpracemega.azurecr.io
        identity: /subscriptions/647d2913-b039-457f-9155-51291e506d79/resourceGroups/rg-bcprace/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-bcprace

  template:
    containers:
      - name: web
        image: bcpracemega.azurecr.io/bcprace-web:v1
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          # python bezi ve stejne aplikaci -> je dostupny pres localhost
          - name: PYTHON_API_URL
            value: http://localhost:8000
          - name: SQLITE_DB_PATH
            value: /data/strava.sqlite
        volumeMounts:
          - volumeName: data
            mountPath: /data

      - name: python
        image: bcpracemega.azurecr.io/bcprace-python:v1
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: SQLITE_DB_PATH
            value: /data/strava.sqlite
        volumeMounts:
          - volumeName: data
            mountPath: /data

    # min 0 = aplikace se uspi, kdyz ji nikdo nepouziva (setri kredit)
    # max 1 = jen jedna kopie, protoze SQLite soubor neumi sdilet vic kopii
    scale:
      minReplicas: 0
      maxReplicas: 1

    # sdilena slozka pro oba kontejnery (DOCASNA - smaze se pri restartu/uspani)
    volumes:
      - name: data
        storageType: EmptyDir
